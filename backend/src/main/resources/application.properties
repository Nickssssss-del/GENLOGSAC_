spring.application.name=repuestos-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/gestion-comercial;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.admin-email=${ADMIN_EMAIL:admin@empresa.local}
app.admin-password=${ADMIN_PASSWORD:change-me-in-env}
